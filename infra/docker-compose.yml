services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - N8N_HOST=${N8N_HOST:-n8n.example.com}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - WEBHOOK_URL=https://${N8N_HOST:-n8n.example.com}/
      - GENERIC_TIMEZONE=Asia/Ho_Chi_Minh
      - N8N_API_KEY=${N8N_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_ADMIN_CHAT_ID=${TELEGRAM_ADMIN_CHAT_ID}
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - N8N_BLOCK_FILE_ACCESS_TO_N8N_FILES=true
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - NODES_EXCLUDE=["n8n-nodes-base.executeCommand","n8n-nodes-base.readWriteFile"]
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-}
      - MIA_MAPS_DEFAULT_LANGUAGE=${MIA_MAPS_DEFAULT_LANGUAGE:-vi}
      - MIA_MAPS_DEFAULT_REGION=${MIA_MAPS_DEFAULT_REGION:-VN}
      - MIA_MAPS_MAX_PLACE_RESULTS=${MIA_MAPS_MAX_PLACE_RESULTS:-5}
      - HOME_ASSISTANT_URL=${HOME_ASSISTANT_URL:-http://host.docker.internal:8123}
      - HOME_ASSISTANT_TOKEN=${HOME_ASSISTANT_TOKEN:-}
      - MIA_HOME_ALLOWED_LABEL=${MIA_HOME_ALLOWED_LABEL:-mia_allowed}
      - MIA_HOME_DASHBOARD_URL=${MIA_HOME_DASHBOARD_URL:-http://192.168.1.10:8123}
      - MIA_HOME_ALLOWED_DOMAINS=${MIA_HOME_ALLOWED_DOMAINS:-light,switch,fan,climate,media_player,scene,script}
      - MIA_HOME_DEFAULT_AREA=${MIA_HOME_DEFAULT_AREA:-}
      - MIA_HOME_ENTITY_ALIASES_JSON=${MIA_HOME_ENTITY_ALIASES_JSON:-}
      - MIA_HOME_TTS_ENTITY_ID=${MIA_HOME_TTS_ENTITY_ID:-}
      - MIA_CORE_URL=${MIA_CORE_URL:-http://mia-core:8000/mia/chat}
      - OWNER_DISPLAY_NAME=${OWNER_DISPLAY_NAME:-User}
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - n8n-net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    networks:
      - n8n-net

  home-assistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: home-assistant
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - TZ=${MIA_TIMEZONE:-Asia/Ho_Chi_Minh}
    volumes:
      - ./homeassistant/config:/config
      - /etc/localtime:/etc/localtime:ro

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      - OLLAMA_KEEP_ALIVE=-1
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - n8n-net

  postgres:
    build:
      context: ./postgres17
    image: mia-postgres17-textsearch:pg17
    container_name: postgres
    restart: unless-stopped
    command: ["postgres", "-c", "shared_preload_libraries=pg_textsearch"]
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-n8n}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-n8n_password}
      - POSTGRES_DB=${POSTGRES_DB:-vectordb}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data_17:/var/lib/postgresql/data
    networks:
      - n8n-net

  memory-embedder:
    build:
      context: ./embedder
    container_name: memory-embedder
    restart: unless-stopped
    environment:
      - EMBED_MODEL=sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
      - MODEL_CACHE_DIR=/models
    ports:
      - "127.0.0.1:8010:8000"
    volumes:
      - memory_models:/models
    networks:
      - n8n-net

  mia-opencode:
    build:
      context: ..
      dockerfile: infra/opencode-gateway/Dockerfile
    container_name: mia-opencode
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - MIA_CODE_ALLOWED_ROOTS=${MIA_CODE_ALLOWED_ROOTS:-/host-projects}
      - MIA_CODE_WORKSPACE_ROOT=${MIA_CODE_WORKSPACE_ROOT:-/workspaces}
      - MIA_CODE_HOST_WORKSPACE_ROOT=${MIA_CODE_HOST_WORKSPACE_ROOT:-/home/huynhminh/Projects/mia-workspaces}
      - MIA_CODE_TIMEOUT_SECONDS=${MIA_CODE_TIMEOUT_SECONDS:-180}
      - MIA_CODE_ALLOWED_REGISTRIES=${MIA_CODE_ALLOWED_REGISTRIES:-pypi.org,files.pythonhosted.org,registry.npmjs.org,github.com,api.github.com,proxy.golang.org,crates.io,index.crates.io}
      - MIA_CODE_ALLOWED_COMMAND_PREFIXES=${MIA_CODE_ALLOWED_COMMAND_PREFIXES:-git status,git diff,git log,git show,git branch,git rev-parse,git ls-files,git grep,python,python3,pytest,ruff,mypy,uv,pip install,pip3 install,npm install,npm run,npm test,pnpm install,pnpm run,pnpm test,yarn install,yarn run,yarn test,node,go,cargo,make}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    ports:
      - "127.0.0.1:8015:8015"
    volumes:
      - /home/huynhminh/Projects:/host-projects
      - /home/huynhminh/Projects/mia-workspaces:/workspaces
    networks:
      - n8n-net

  mia-core:
    build:
      context: ..
      dockerfile: infra/Dockerfile.agent
    container_name: mia-core
    restart: unless-stopped
    env_file:
      - ../.env
    depends_on:
      - postgres
      - memory-embedder
      - n8n
      - mia-opencode
    environment:
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - OPENROUTER_HTTP_REFERER=${OPENROUTER_HTTP_REFERER:-https://n8n.example.com}
      - OPENROUTER_X_TITLE=${OPENROUTER_X_TITLE:-Mia LangChain Core}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - MIA_DEEPSEEK_MODEL=${MIA_DEEPSEEK_MODEL:-deepseek-v4-flash}
      - MIA_MEMORY_EMBEDDER_URL=${MIA_MEMORY_EMBEDDER_URL:-http://memory-embedder:8000/embed}
      - MIA_TOOL_GATEWAY_URL=${MIA_TOOL_GATEWAY_URL:-http://n8n:5678/webhook/mia-tool}
      - MIA_CODE_TIMEOUT_SECONDS=${MIA_CODE_TIMEOUT_SECONDS:-180}
      - MIA_CODE_RUNNER_TIMEOUT_SECONDS=${MIA_CODE_RUNNER_TIMEOUT_SECONDS:-180}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-}
      - MIA_MAPS_DEFAULT_LANGUAGE=${MIA_MAPS_DEFAULT_LANGUAGE:-vi}
      - MIA_MAPS_DEFAULT_REGION=${MIA_MAPS_DEFAULT_REGION:-VN}
      - MIA_MAPS_MAX_PLACE_RESULTS=${MIA_MAPS_MAX_PLACE_RESULTS:-5}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_BASE_URL=${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      - MIA_GROQ_STT_MODEL=${MIA_GROQ_STT_MODEL:-whisper-large-v3-turbo}
      - MIA_GROQ_TTS_MODEL=${MIA_GROQ_TTS_MODEL:-canopylabs/orpheus-v1-english}
      - MIA_GROQ_TTS_VOICE=${MIA_GROQ_TTS_VOICE:-troy}
      - MIA_GROQ_TTS_FORMAT=${MIA_GROQ_TTS_FORMAT:-wav}
      - MIA_GROQ_VISION_MODEL=${MIA_GROQ_VISION_MODEL:-meta-llama/llama-4-scout-17b-16e-instruct}
      - MIA_OCR_LANGUAGES=${MIA_OCR_LANGUAGES:-vie+eng}
      - MIA_TIMEZONE=${MIA_TIMEZONE:-Asia/Ho_Chi_Minh}
      - MIA_MODEL_TEMPERATURE=${MIA_MODEL_TEMPERATURE:-0}
      - MIA_MODEL_MAX_TOKENS=${MIA_MODEL_MAX_TOKENS:-900}
      - MIA_RECURSION_LIMIT=${MIA_RECURSION_LIMIT:-12}
      - MIA_PROMPT_CACHE_ENABLED=${MIA_PROMPT_CACHE_ENABLED:-true}
      - MIA_PROMPT_CACHE_NAMESPACE=${MIA_PROMPT_CACHE_NAMESPACE:-mia}
      - MIA_PROMPT_CACHE_VERSION=${MIA_PROMPT_CACHE_VERSION:-v1}
      - MIA_REQUEST_TIMEOUT_SECONDS=${MIA_REQUEST_TIMEOUT_SECONDS:-60}
      - MIA_WEB_MAX_RESPONSE_BYTES=${MIA_WEB_MAX_RESPONSE_BYTES:-2097152}
      - MIA_WEB_MAX_REDIRECTS=${MIA_WEB_MAX_REDIRECTS:-5}
      - MIA_MEDIA_MAX_INPUT_BYTES=${MIA_MEDIA_MAX_INPUT_BYTES:-26214400}
      - MIA_API_RATE_LIMIT_PER_MINUTE=${MIA_API_RATE_LIMIT_PER_MINUTE:-120}
      - MIA_MCP_SERVERS_JSON=${MIA_MCP_SERVERS_JSON:-}
      - MIA_AUTOMATION_POLL_SECONDS=${MIA_AUTOMATION_POLL_SECONDS:-30}
      - MIA_EVALUATOR_MODE=${MIA_EVALUATOR_MODE:-hard}
      - MIA_EVALUATOR_MAX_RETRIES=${MIA_EVALUATOR_MAX_RETRIES:-2}
      - OWNER_DISPLAY_NAME=${OWNER_DISPLAY_NAME:-User}
    ports:
      - "0.0.0.0:8000:8000"
    networks:
      - n8n-net

volumes:
  n8n_data:
    external: true
    name: n8n_n8n_data
  ollama_data:
  pg_data:
  pg_data_17:
    external: true
    name: n8n_pg_data_17
  memory_models:

networks:
  n8n-net:
    driver: bridge
