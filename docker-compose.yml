services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n
    restart: unless-stopped
    environment:
      - N8N_HOST=n8n.huynhminh.com
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - WEBHOOK_URL=https://n8n.huynhminh.com/
      - GENERIC_TIMEZONE=Asia/Ho_Chi_Minh
      - N8N_API_KEY=${N8N_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_ADMIN_CHAT_ID=${TELEGRAM_ADMIN_CHAT_ID}
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - N8N_BLOCK_FILE_ACCESS_TO_N8N_FILES=true
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - NODES_EXCLUDE=["n8n-nodes-base.executeCommand","n8n-nodes-base.readWriteFile"]
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - MIA_CORE_URL=${MIA_CORE_URL:-http://mia-core:8000/mia/chat}
      - MIA_CORE_API_TOKEN=${MIA_CORE_API_TOKEN:-}
      - MIA_TOOL_GATEWAY_TOKEN=${MIA_TOOL_GATEWAY_TOKEN:-}
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - n8n-net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    networks:
      - n8n-net

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      - OLLAMA_KEEP_ALIVE=-1
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - n8n-net

  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-n8n}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-n8n_password}
      - POSTGRES_DB=${POSTGRES_DB:-vectordb}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - n8n-net

  memory-embedder:
    build:
      context: ./memory/embedder
    container_name: memory-embedder
    restart: unless-stopped
    environment:
      - EMBED_MODEL=sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
      - MODEL_CACHE_DIR=/models
    ports:
      - "127.0.0.1:8010:8000"
    volumes:
      - memory_models:/models
    networks:
      - n8n-net

  mia-core:
    build:
      context: ./langchain_core
    container_name: mia-core
    restart: unless-stopped
    depends_on:
      - postgres
      - memory-embedder
      - n8n
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - OPENROUTER_HTTP_REFERER=${OPENROUTER_HTTP_REFERER:-https://n8n.huynhminh.com}
      - OPENROUTER_X_TITLE=${OPENROUTER_X_TITLE:-Mia LangChain Core}
      - PRIMARY_LLM_PROVIDER=${PRIMARY_LLM_PROVIDER:-openrouter}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - MIA_DEEPSEEK_MODEL=${MIA_DEEPSEEK_MODEL:-deepseek-v4-flash}
      - MIA_MODEL=${MIA_MODEL:-openai/gpt-4.1-mini}
      - MIA_POSTGRES_URI=${MIA_POSTGRES_URI:-postgresql://n8n:n8n_password@postgres:5432/vectordb?sslmode=disable}
      - MIA_MEMORY_EMBEDDER_URL=${MIA_MEMORY_EMBEDDER_URL:-http://memory-embedder:8000/embed}
      - MIA_TOOL_GATEWAY_URL=${MIA_TOOL_GATEWAY_URL:-http://n8n:5678/webhook/mia-tool}
      - MIA_TOOL_GATEWAY_TOKEN=${MIA_TOOL_GATEWAY_TOKEN:-}
      - MIA_CORE_API_TOKEN=${MIA_CORE_API_TOKEN:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_BASE_URL=${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      - MIA_GROQ_STT_MODEL=${MIA_GROQ_STT_MODEL:-whisper-large-v3-turbo}
      - MIA_GROQ_TTS_MODEL=${MIA_GROQ_TTS_MODEL:-canopylabs/orpheus-v1-english}
      - MIA_GROQ_TTS_VOICE=${MIA_GROQ_TTS_VOICE:-troy}
      - MIA_GROQ_TTS_FORMAT=${MIA_GROQ_TTS_FORMAT:-wav}
      - MIA_GROQ_VISION_MODEL=${MIA_GROQ_VISION_MODEL:-meta-llama/llama-4-scout-17b-16e-instruct}
      - MIA_OCR_LANGUAGES=${MIA_OCR_LANGUAGES:-vie+eng}
      - MIA_TIMEZONE=${MIA_TIMEZONE:-Asia/Ho_Chi_Minh}
      - MIA_MODEL_TEMPERATURE=${MIA_MODEL_TEMPERATURE:-0}
      - MIA_MODEL_MAX_TOKENS=${MIA_MODEL_MAX_TOKENS:-900}
      - MIA_RECURSION_LIMIT=${MIA_RECURSION_LIMIT:-12}
      - MIA_REQUEST_TIMEOUT_SECONDS=${MIA_REQUEST_TIMEOUT_SECONDS:-60}
      - MIA_EVALUATOR_MODE=${MIA_EVALUATOR_MODE:-hard}
      - MIA_EVALUATOR_MAX_RETRIES=${MIA_EVALUATOR_MAX_RETRIES:-2}
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - n8n-net

volumes:
  n8n_data:
  ollama_data:
  pg_data:
  memory_models:

networks:
  n8n-net:
    driver: bridge
